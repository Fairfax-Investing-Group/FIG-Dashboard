name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install portfolio data dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh portfolio snapshot for static hosting
        env:
          PORTFOLIO_CACHE: public/portfolio-current.json
        run: python scripts/exportPortfolioSnapshot.py
      - name: Refresh portfolio study snapshots for static hosting
        run: python scripts/exportPortfolioStudies.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_STUDY_API_URL: ${{ vars.VITE_STUDY_API_URL || vars.VITE_API_BASE_URL || 'https://fig-dashboard.onrender.com' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # These are public browser credentials, never a service-role key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://juxbbrfpridbifpfymlm.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_J53BuJlD682uEpb6EFuXdg_dCqPFr3s' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fairfax-financial"
version = "0.1.0"
description = "Reproducible source-only NYSE financial lake"
requires-python = ">=3.13"
dependencies = [
  "arelle-release>=2.46,<3", "boto3>=1.43,<2", "httpx>=0.28,<1",
  "polars>=1.44,<2", "pyarrow>=23,<25", "pyiceberg[sql-sqlite,pyarrow]>=0.11,<0.12",
  "typer>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<1"]

[project.scripts]
financial = "fairfax_financial.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fairfax_financial = ["mappings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real filing acquisition (requires SEC_USER_AGENT and network)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
